[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingv-eruption"
version = "0.1.0"
description = "Predict the time to a volcano's next eruption from seismic segments (INGV Kaggle competition)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "lightgbm>=4",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]
notebook = ["matplotlib", "scikit-learn", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
